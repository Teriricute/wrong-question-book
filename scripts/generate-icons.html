<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>生成 PWA 图标</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #FBF7EE; }
    canvas { border: 1px solid #ccc; margin: 10px; }
    button { padding: 10px 20px; margin: 10px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>错题本 PWA 图标生成器</h1>
  <p>点击按钮生成 192x192 和 512x512 的 PNG 图标，然后右键保存到 public/ 目录。</p>
  <div>
    <canvas id="c192" width="192" height="192"></canvas>
    <canvas id="c512" width="512" height="512"></canvas>
  </div>
  <button onclick="drawAll()">生成图标</button>
  <p>生成后，右键点击每个图标 → 另存为 → 保存到 public/ 目录下：</p>
  <ul>
    <li>第一个保存为 <code>icon-192.png</code></li>
    <li>第二个保存为 <code>icon-512.png</code></li>
  </ul>

  <script>
    function drawIcon(canvas) {
      const size = canvas.width;
      const ctx = canvas.getContext('2d');

      // 背景
      const pad = size * 0.08;
      const w = size - pad * 2;
      const h = size * 0.78 - pad * 2;

      // 书本主体
      ctx.fillStyle = '#B23A2E';
      ctx.strokeStyle = '#8B2218';
      ctx.lineWidth = size * 0.03;
      ctx.beginPath();
      const rx = size * 0.08;
      ctx.roundRect(pad, pad, w, h, rx);
      ctx.fill();
      ctx.stroke();

      // 中线
      ctx.strokeStyle = '#FBF7EE';
      ctx.globalAlpha = 0.6;
      ctx.lineWidth = size * 0.02;
      ctx.beginPath();
      ctx.moveTo(size / 2, pad);
      ctx.lineTo(size / 2, pad + h);
      ctx.stroke();

      // 装饰弧线
      ctx.globalAlpha = 1;
      ctx.strokeStyle = '#FBF7EE';
      ctx.lineWidth = size * 0.02;
      ctx.beginPath();
      ctx.ellipse(size / 2, size * 0.38, size * 0.15, size * 0.06, 0, 0, Math.PI * 2);
      ctx.stroke();

      // 点
      ctx.fillStyle = '#FBF7EE';
      ctx.globalAlpha = 0.4;
      ctx.beginPath();
      ctx.arc(size / 2, size * 0.55, size * 0.04, 0, Math.PI * 2);
      ctx.fill();

      // 垂线
      ctx.strokeStyle = '#FBF7EE';
      ctx.lineWidth = size * 0.015;
      ctx.beginPath();
      ctx.moveTo(size / 2, size * 0.6);
      ctx.lineTo(size / 2, pad + h - size * 0.06);
      ctx.stroke();
    }

    function drawAll() {
      drawIcon(document.getElementById('c192'));
      drawIcon(document.getElementById('c512'));
    }

    drawAll();
  </script>
</body>
</html>
